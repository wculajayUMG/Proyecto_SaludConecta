{% extends 'base.html' %}
{% block content %}
<div class="login-container">
    <div class="login-branding">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="branding-content">
            <h1>BIENVENIDO</h1>
            <p>Plataforma inteligente para la gestión de datos médicos y análisis clínico avanzado.</p>
        </div>
    </div>

    <div class="login-form-section">
        <div class="form-wrapper">
            <img src="{{ url_for('static', filename='logo_SaludConeta.jpeg') }}" alt="SaludConeta" style="display: block; margin: 0 auto 20px; max-width: 180px; height: auto;">
            <h2>Iniciar Sesión</h2>
            <p class="subtitle">Ingrese sus credenciales para acceder al sistema.</p>
            
            <form method="POST">
                <div class="input-group">
                    <i class="icon-user">👤</i>
                    <input type="text" name="username" placeholder="User Name" required>
                </div>

                <div class="input-group">
                    <i class="icon-lock">🔒</i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-signin">Iniciar</button>
            </form>

        </div>
    </div>
</div>

<style>
/* Reset de márgenes para que ocupe todo */
body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

.login-container {
    display: flex;
    height: 90vh;
    width: 100%;
    overflow: hidden;
}

/* --- LADO IZQUIERDO (AZUL) --- */
.login-branding {
    flex: 1.2;
    background: linear-gradient(135deg, #0d243e, #1e4b8a);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    padding: 40px;
}

.branding-content {
    position: relative;
    z-index: 10;
    max-width: 400px;
}

.branding-content h1 { font-size: 3rem; margin-bottom: 5px; letter-spacing: 2px; }
.branding-content h3 { font-weight: 300; opacity: 0.9; margin-top: 0; }

/* Esferas decorativas */
.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
}
.circle-1 { width: 400px; height: 400px; top: -100px; left: -100px; background: rgba(56, 189, 248, 0.2); }
.circle-2 { width: 300px; height: 300px; bottom: -50px; right: 10%; background: rgba(56, 189, 248, 0.1); }

/* --- LADO DERECHO (FORMULARIO) --- */
.login-form-section {
    flex: 1;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
}

.form-wrapper { width: 100%; max-width: 350px; }
.form-wrapper h2 { font-size: 2.2rem; color: #333; margin-bottom: 10px; }
.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 30px; }

/* Inputs */
.input-group {
    background: #f0f2f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 12px 15px;
    margin-bottom: 15px;
}
.input-group input {
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    margin-left: 10px;
    font-size: 1rem;
}

.form-options {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    margin-bottom: 25px;
    color: #666;
}
.form-options a { color: #1e4b8a; text-decoration: none; }

/* Botones */
.btn-signin {
    width: 100%;
    padding: 14px;
    background: #0d243e; /* Tu color base */
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}
.btn-signin:hover { background: #1e4b8a; }

.divider {
    text-align: center;
    margin: 20px 0;
    position: relative;
}
.divider::before {
    content: "";
    position: absolute;
    top: 50%; left: 0; width: 100%; height: 1px; background: #ddd;
}
.divider span { background: white; padding: 0 10px; position: relative; color: #888; font-size: 0.8rem; }

.btn-other {
    width: 100%;
    padding: 12px;
    background: white;
    border: 2px solid #333;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
}

.signup-text { text-align: center; margin-top: 30px; font-size: 0.9rem; color: #666; }
.signup-text a { color: #38bdf8; font-weight: bold; text-decoration: none; }

/* Esconder el navbar de la base solo en el login si lo deseas */
nav { display: none !important; }
</style>
{% endblock %}
